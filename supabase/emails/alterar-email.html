<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirma o novo email</title></head>
<body style="margin:0;padding:0;background:#F4F4F5;font-family:Helvetica,Arial,sans-serif;color:#2A2426">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F4F5;padding:32px 12px">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;overflow:hidden">
  <tr><td style="background:#D0103C;padding:28px 32px" align="left">
    <img src="https://aportafechada.net/img/email-logo.png" width="44" height="44" alt="" style="display:inline-block;vertical-align:middle;border-radius:10px">
    <span style="display:inline-block;vertical-align:middle;margin-left:12px;font-size:20px;font-weight:800;color:#ffffff">A Porta Fechada</span>
  </td></tr>
  <tr><td style="padding:32px">
    <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25;color:#111111">Confirma o teu novo email</h1>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.5">Pediste para mudar o email da tua conta de <b>{{ .Email }}</b> para <b>{{ .NewEmail }}</b>.</p>
    <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:12px;background:#D0103C">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none">Confirmar novo email</a>
    </td></tr></table>
    <p style="margin:28px 0 0;font-size:13px;line-height:1.5;color:#6B6264">Se não pediste esta mudança, ignora este email e muda a tua palavra-passe.</p>
  </td></tr>
  <tr><td style="padding:20px 32px;border-top:1px solid #E4E4E7;font-size:12px;line-height:1.5;color:#6B6264">
    A Porta Fechada · <a href="https://aportafechada.net" style="color:#6B6264">aportafechada.net</a>
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>
