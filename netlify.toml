# Netlify: publica a raiz do repositório tal como está, sem compilação.
# Não há passo de build porque não há framework nem empacotador — é HTML + CSS + JS
# com módulos ES nativos, servidos diretamente.
[build]
  publish = "."

# Os ficheiros versionados à mão em index.html (?v=...) só cobrem app.css e js/main.js.
# Os restantes módulos são importados sem query string, por isso chegam ao browser por
# outra via. A combinação max-age=0 + must-revalidate abaixo é o que garante que uma
# alteração chega a quem já visitou o site: o browser revalida sempre e recebe o ETag novo.
# Se algum dia mudares isto para immutable / max-age=31536000, tens de versionar também
# lib.js, state.js, pay.js e views/*.js — ou o browser fica com código velho sem dar aviso.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    # Sem HSTS antes, um atacante que intercepte a primeira visita pode reescrever
    # os pedidos de DNS e servir uma versão sua do site com a mesma origem.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ---------------------------------------------------------------------------------
# Content-Security-Policy — escrito, mas COMENTADO de propósito.
# ---------------------------------------------------------------------------------
# Active-o descomentando o bloco de baixo. NÃO o active às cegas: não consigo testar
# as lives sem uma conta e sem abrir uma sala, e um CSP errado deixa a página em branco
# sem erro nenhum na consola. Testa primeiro com o site aberto e a consola limpa.
#
# Porquê que vale a pena: o `html` das promoções é injectado no site inteiro, e o
# despachante de acções em js/main.js é global. Um CSP é a única coisa que trava um
# XSS mesmo que o escape falhe num sítio que ainda não encontrámos.
#
# O único script inline é o arranque do tema, em index.html (96 bytes, só lê o
# localStorage). Entra por hash em vez de 'unsafe-inline', para não abrir a porta
# a scripts inlined. Se editares essa linha, o hash fica errado e o site não arranca
# — recalcula com:
#
#   node -e "console.log('sha256-'+require('crypto').createHash('sha256')
#     .update('try{document.documentElement.dataset.theme=localStorage.getItem(\'apf-theme\')||\'light\'}catch(e){}')
#     .digest('base64'))"
#
# style-src precisa de 'unsafe-inline' porque as vistas usam style="" em dezenas de
# sítios. Aceita-se: style attributes não executam script.
#
# TEM DE AJUSTAR: o connect-src do LiveKit. O domínio do servidor chega-te pela edge
# function live-token e não está no repositório, por isso deixei o wildcard. Vê o que a
# função devolve e troca por esse domínio exacto. Um wildcard em connect-src é mais
# fraco, mas melhor do que um CSP que bloqueia as lives.
#
# [[headers]]
#   for = "/*"
#   [headers.values]
#     Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-VEt0g6CRBPJy2ShHjuleiUjX1ezK5jBWUoyWHits//c='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://xkcngjrlfmozlsttuxgs.supabase.co; connect-src 'self' https://xkcngjrlfmozlsttuxgs.supabase.co wss://xkcngjrlfmozlsttuxgs.supabase.co https://*.livekit.cloud wss://*.livekit.cloud; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
